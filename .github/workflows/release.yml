name: Publish Report Builder release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifacts and prepare patch notes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, zipfile
          from pathlib import Path

          manifest = json.loads(Path('version.json').read_text(encoding='utf-8'))
          tag = os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF_TYPE'] == 'tag' else 'v' + str(manifest['version'])
          if not re.fullmatch(r'v[0-9]+(?:\.[0-9]+){0,2}', tag):
              raise SystemExit('Tag must be v followed by a version')
          version = tag[1:]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'RELEASE_TAG={tag}\n')
          html = Path(f'Report-Builder_V_{version}.html')
          archive = html.with_suffix('.zip')
          if str(manifest['version']) != version or manifest['file'] != html.name:
              raise SystemExit('Release tag does not match version.json')
          # Git can normalize HTML line endings independently of the ZIP.
          def normalize(data):
              return data.replace(b'\r\n', b'\n')
          with zipfile.ZipFile(archive) as z:
              if z.namelist() != [html.name] or normalize(z.read(html.name)) != normalize(html.read_bytes()):
                  raise SystemExit('ZIP does not match the program HTML')
          readme = Path('README.md').read_text(encoding='utf-8')
          heading = rf'^## Report Builder V{re.escape(version)}(?:\s+—[^\n]*)?$'
          match = re.search(heading + r'\n([\s\S]*?)(?=^## |\Z)', readme, re.MULTILINE)
          if not match or '### Patch Notes' not in match[1]:
              raise SystemExit('Add Patch Notes to the matching README section')
          notes = match[1].split('### Patch Notes', 1)[1].strip()
          Path('release-notes.md').write_text(notes + '\n', encoding='utf-8')
          PY
      - name: Publish release and downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then exit 0; fi
          gh release create "$RELEASE_TAG" \
            "Report-Builder_V_${version}.zip" "Report-Builder_V_${version}.html" \
            --verify-tag --title "Report Builder V${version}" \
            --notes-file release-notes.md --latest
